[package]
name = "atp-web"
version = "0.1.0"
edition = "2021"
authors = ["GMT AGWS Team"]
description = "Web UI for AGWS Target Practice - Interactive guide star selection"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Note: atp-rs cannot be used directly in WASM due to tokio/reqwest dependencies
# Use API backend instead

# Leptos framework
leptos = { version = "0.6", features = ["csr"] }
leptos_meta = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Logging
log = "0.4"
console_log = "1.0"
console_error_panic_hook = "0.1"

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "HtmlInputElement",
    "HtmlSelectElement",
    "Window",
    "Document",
] }

# Random data generation
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

# Timers for async delays
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
default = ["csr"]
csr = ["leptos/csr", "leptos_meta/csr", "leptos_router/csr"]
hydrate = ["leptos/hydrate", "leptos_meta/hydrate", "leptos_router/hydrate"]

[package.metadata.leptos]
# The name of the binary target for the server
bin-package = "atp-web"

# The site root folder
site-root = "target/site"

# The port to serve the app
site-addr = "127.0.0.1:3000"

# Assets source dir
assets-dir = "public"

# The tailwind input file
tailwind-input-file = "style/main.css"

# Browser open
browseropen = false

# Watch additional files
watch-additional-files = ["style"]

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
